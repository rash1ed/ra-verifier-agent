[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-verifier-agent"
version = "0.1.0"
description = "Evidence-first artifact verifier."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ra-verify = "verifier.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["verifier*"]
